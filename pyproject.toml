
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-shape-check"
version = "0.1.0"
description = "Compare environment file variable names without showing values"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hamdam" }]
dependencies = []

[project.scripts]
env-shape-check = "env_shape_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
